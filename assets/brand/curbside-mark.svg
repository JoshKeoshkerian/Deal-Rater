<!--
  The Curbside mark. THE SOURCE, and the only place these paths are authored.

  A sage-green sedan with a check mark cut through its door, on a white disc.
  Redrawn as vectors (64x64) from the owner's supplied artwork in November
  2026, replacing the earlier navy-plate car.

  Every raster in the repo is rendered from this file by ./render.mjs: the
  extension's toolbar icons, the site's favicon, apple-touch icon and link-
  preview card, and the old static page's copies. Two inline copies are traced
  back to it and must be kept in sync by hand:
    - curbside-app/components/BrandMark.tsx (the car alone, without the disc --
      on the site's white header the disc is invisible and only shrinks the car)
    - the inline mark in the header of curbside-site/index.html

  The white disc is part of the mark, not a container: without it, the white
  windows, wheel arches and check would be holes onto whatever is behind the
  icon (a dark browser tab, say) instead of the shapes they are drawn as.

  Colours: sage #93BB99 (sampled from the artwork) and white.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Curbside">
  <title>Curbside</title>
  <circle cx="32" cy="32" r="32" fill="#FFFFFF"/>
  <path d="M10.6 38.7C9.6 36.4 9.2 32 9.6 29.2C11.2 28.5 13.4 27.6 15 26.7C19 23.7 23.6 22.1 28.4 22.1C33 22.2 37 23.4 40.2 25.8L42.6 27.9C46.5 28.8 51 29.8 53.6 31.4C55.3 32.5 56 34.4 55.8 36.3L55.5 38.4C55.3 38.7 55 38.8 54.6 38.8H11.4C11 38.8 10.7 38.8 10.6 38.7Z" fill="#93BB99"/>
  <circle cx="17.7" cy="38.6" r="5.3" fill="#FFFFFF"/>
  <circle cx="46.3" cy="38.6" r="5.3" fill="#FFFFFF"/>
  <circle cx="17.7" cy="38.6" r="3.6" fill="#93BB99"/>
  <circle cx="46.3" cy="38.6" r="3.6" fill="#93BB99"/>
  <circle cx="17.7" cy="38.6" r="1.55" fill="#FFFFFF"/>
  <circle cx="46.3" cy="38.6" r="1.55" fill="#FFFFFF"/>
  <path d="M19.3 28.9C18.3 28.9 17.9 28 18.6 27.3C20.6 25.4 24 24.2 27.8 24.1V28.9Z" fill="#FFFFFF"/>
  <path d="M29.9 24.1C33.6 24.1 36.8 25 39.4 26.6L41.4 28.9H29.9Z" fill="#FFFFFF"/>
